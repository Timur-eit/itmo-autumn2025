stages:
  - build

variables:
  DOCKER_TLS_CERTDIR: ''

build_images:
  stage: build
  tags:
    - docker
  image: docker:26
  services:
    - name: docker:26-dind
      command: ['--tls=false']
  script:
    - docker version
    - docker build -t autumn2025-frontend:ci ./frontend
    - docker build -t autumn2025-backend:ci ./backend
