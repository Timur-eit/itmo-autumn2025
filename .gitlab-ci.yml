image: docker:27

services:
  - name: docker:27-dind
    command: ['--tls=false']

variables:
  DOCKER_TLS_CERTDIR: ''
  DOCKER_HOST: tcp://docker:2375
  DOCKER_DRIVER: overlay2
  DEPLOY_HOST: 89.169.148.15

stages:
  - build
  - deploy

before_script:
  - docker info
  - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"

build-backend:
  stage: build
  script:
    - docker build
      -t "$CI_REGISTRY_IMAGE/backend:latest"
      -t "$CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHORT_SHA"
      ./backend
    - docker push "$CI_REGISTRY_IMAGE/backend:latest"
    - docker push "$CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHORT_SHA"

build-frontend:
  stage: build
  script:
    - docker build
      -t "$CI_REGISTRY_IMAGE/frontend:latest"
      -t "$CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHORT_SHA"
      ./frontend
    - docker push "$CI_REGISTRY_IMAGE/frontend:latest"
    - docker push "$CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHORT_SHA"

deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - echo -e "Host *\n\tStrictHostKeyChecking no\n" > ~/.ssh/config
  script:
    - ssh student@$DEPLOY_HOST "echo SSH OK"
    - |
      ssh student@$DEPLOY_HOST "
      set -e 
      echo 'SSH OK'
      cd /opt/autumn2025 &&
      docker compose pull &&
      docker compose up -d
      docker compose ps
      "
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
